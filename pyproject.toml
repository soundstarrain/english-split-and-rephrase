[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "english-split-and-rephrase"
version = "0.1.0"
description = "Recursive English split-and-rephrase inference using two Hugging Face models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "English Split and Rephrase contributors" }]
keywords = ["NLP", "sentence splitting", "text simplification", "Transformers"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "safetensors>=0.4",
  "torch>=2.2",
  "transformers>=4.48,<6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
split-and-rephrase = "english_split_rephrase.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
